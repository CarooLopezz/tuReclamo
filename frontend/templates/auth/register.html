{% extends "layout.html" %}

{% block title %}Registro{% endblock %}

{% block body %}
<img src="{{ url_for('static', filename='images/tureclamo.png') }}" alt="Tu Reclamo" class="logo-reclamo">
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm p-4" style="border:2px solid #ff4d4d">
      <h1 class="mb-4 text-center">Registro</h1>

      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" name="username" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <div class="mb-3"></div>
        <label for="role">Tipo de usuario:</label>
        <select name="role" id="role" required>
          <option value="">Seleccionar...</option>
          <option value="vecino">Vecino</option>
          <option value="director">Director</option>
        </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
      </form>

      <p class="mt-3 text-center">
        ¿Ya tenés cuenta?
        <a href="{{ url_for('auth.login') }}">Iniciar Sesión</a>
      </p>
    </div>
  </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const data = {
        username: form.username.value,
        email: form.email.value,
        password: form.password.value,

    };
    const res = await fetch("/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });
    const result = await res.json();
    if (res.ok) {
        window.location.href = "/dashboard";
    } else {
        alert(result.message);
    }
});
</script>
{% endblock %}
